[General]
network = BbrDumbbell
sim-time-limit = 60s
**.scalar-recording = true
**.vector-recording = true

# ---------------------------------------------------------------------------
# TCP common settings
# ---------------------------------------------------------------------------
**.tcp.mss = 1460
**.tcp.advertisedWindow = 1048576
**.tcp.windowScalingSupport = true
**.tcp.windowScalingFactor = -1
**.tcp.initialSsthresh = 65535
**.tcp.delayedAcksEnabled = false
**.tcp.nagleEnabled = false
**.tcp.increasedIWEnabled = false

# BBR needs SACK/RACK.  In INET 4.5 the standard Tcp connection only allows
# SACK together with TcpReno, so the BBR receiver uses TcpReno as well.
**.tcp.sackSupport = true

# ---------------------------------------------------------------------------
# BBR sender
# ---------------------------------------------------------------------------
*.clientB.tcp.typename = "bbr.transportlayer.bbr.Bbr"
*.clientB.tcp.tcpAlgorithmClass = "BbrFlavour"

# BBR receiver: standard TCP, TcpReno because SACK is enabled.
*.serverB.tcp.tcpAlgorithmClass = "TcpReno"

# ---------------------------------------------------------------------------
# No competing flow in the first sanity check.
# ---------------------------------------------------------------------------
*.clientR.numApps = 0
*.serverR.numApps = 0

# ---------------------------------------------------------------------------
# Queue configuration (1 BDP by default)
# ---------------------------------------------------------------------------
# 40 Mbps * 10 ms / 8 = 50,000 B ~= 34 packets of 1500 B.
*.router1.ppp[2].queue.packetCapacity = 34
*.router2.ppp[0].queue.packetCapacity = 34

**.ppp[*].queue.typename = "DropTailQueue"
**.ppp[*].queue.packetCapacity = 100000

# ---------------------------------------------------------------------------
# BBR flow: clientB -> serverB
# ---------------------------------------------------------------------------
*.clientB.numApps = 1
*.clientB.app[0].typename = "TcpSessionApp"
*.clientB.app[0].active = true
*.clientB.app[0].connectAddress = "serverB"
*.clientB.app[0].connectPort = 1000
*.clientB.app[0].tOpen = 0.1s
*.clientB.app[0].tSend = 0.2s
*.clientB.app[0].tClose = -1s
*.clientB.app[0].sendBytes = 1GiB

*.serverB.numApps = 1
*.serverB.app[0].typename = "TcpSinkApp"
*.serverB.app[0].localPort = 1000

# ---------------------------------------------------------------------------
# Vector recording
# ---------------------------------------------------------------------------
**.tcp.conn-*.cwnd.result-recording-modes = vector
**.tcp.conn-*.ssthresh.result-recording-modes = vector
**.tcp.conn-*.rtt.result-recording-modes = vector
**.tcp.conn-*.srtt.result-recording-modes = vector
**.tcp.conn-*.rto.result-recording-modes = vector
**.tcp.conn-*.numRtos.result-recording-modes = vector
**.tcp.conn-*.tcpRcvPayloadBytes.result-recording-modes = vector
**.tcp.conn-*.tcpRcvQueueDrops.result-recording-modes = vector

*.clientB.tcp.conn-*.pacingGain.result-recording-modes = vector
*.clientB.tcp.conn-*.estimatedBdp.result-recording-modes = vector
*.clientB.tcp.conn-*.minRtt.result-recording-modes = vector
*.clientB.tcp.conn-*.targetCwnd.result-recording-modes = vector
*.clientB.tcp.conn-*.roundCount.result-recording-modes = vector

**.ppp[*].queue.queueLength.result-recording-modes = vector
**.ppp[*].queue.outgoingDataRate.result-recording-modes = vector

# ---------------------------------------------------------------------------
# Configs
# ---------------------------------------------------------------------------
[Config BBR_SINGLE]
description = "Single BBRv1 flow, 1 BDP, 10 Mbps / 40 ms"

[Config BDP1_BBR]
description = "1 BDP, BBRv1 (clientB) vs Reno (clientR)"
sim-time-limit = 200s
*.clientR.numApps = 1
*.clientR.app[0].typename = "TcpSessionApp"
*.clientR.app[0].active = true
*.clientR.app[0].connectAddress = "serverR"
*.clientR.app[0].connectPort = 2000
*.clientR.app[0].tOpen = 0.1s
*.clientR.app[0].tSend = 0.2s
*.clientR.app[0].tClose = -1s
*.clientR.app[0].sendBytes = 1GiB
*.clientR.tcp.tcpAlgorithmClass = "TcpReno"
*.serverR.numApps = 1
*.serverR.app[0].typename = "TcpSinkApp"
*.serverR.app[0].localPort = 2000
*.serverR.tcp.tcpAlgorithmClass = "TcpReno"

[Config BDP4_BBR]
description = "4 BDP, BBRv1 (clientB) vs Reno (clientR)"
extends = BDP1_BBR
sim-time-limit = 180s
*.router1.ppp[2].queue.packetCapacity = 134
*.router2.ppp[0].queue.packetCapacity = 134
[Config BDP4_BBR_ONLY]
extends = BDP4_BBR
sim-time-limit = 60s
*.clientR.numApps = 0
*.serverR.numApps = 0

[Config BDP4_RENO_ONLY]
extends = BDP4_BBR
sim-time-limit = 60s
*.clientB.numApps = 0
*.serverB.numApps = 0

[Config RENO_SINGLE]
extends = BDP1_BBR
sim-time-limit = 60s
*.clientB.numApps = 0
*.serverB.numApps = 0
[Config BDP1_RENO_RENO]
description = "1 BDP, Reno (clientB) vs Reno (clientR)"
extends = BDP1_BBR


*.clientB.tcp.typename = "Tcp"
*.clientB.tcp.tcpAlgorithmClass = "TcpReno"
*.serverB.tcp.tcpAlgorithmClass = "TcpReno"

*.clientB.numApps = 1
*.clientR.numApps = 1
[Config BDP1_BBR_BBR]
description = "1 BDP, BBR vs BBR"
extends = BDP1_BBR

*.clientR.tcp.typename = "bbr.transportlayer.bbr.Bbr"
*.clientR.tcp.tcpAlgorithmClass = "BbrFlavour"
*.serverR.tcp.tcpAlgorithmClass = "TcpReno"


[Config test]
extends = BDP1_BBR

**.clientB.tcp.bbrCwndGain = 2.0
**.clientB.tcp.bbrHighGain = 2.89
**.clientB.tcp.bbrInitialCwndMss = 4
**.clientB.tcp.bbrSendQuantumMss = 1
**.clientB.tcp.bbrProbeRttDuration = 0.2s
**.clientB.tcp.bbrMinRttFilterLen = 10s
**.clientB.tcp.bbrBwWindowRounds = 10
**.clientB.tcp.bbrPacingMargin = 0.01



